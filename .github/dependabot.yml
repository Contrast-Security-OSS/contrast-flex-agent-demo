    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 5
      include:
          - '*'
      exclude:
          - react

  - package-ecosystem: maven
    directory: /DEMO/apache-tomcat-9.0.95/webapps/contrast-demo/META-INF/maven/com.contrast.demo/contrast-demo
    schedule:
      interval: daily
    groups:
      dev-dependencies:
          applies-to: version-updates
          patterns:
              - '*'
          dependency-type: development
      production-dependencies:
          applies-to: version-updates
          patterns:
              - '*'
          dependency-type: production
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 5
      include:
          - '*'
      exclude:
          - react

  - package-ecosystem: maven
    directory: /DEMO/java-spring-boot
    schedule:
      interval: daily
    groups:
      dev-dependencies:
          applies-to: version-updates
          patterns:
              - '*'
          dependency-type: development
      production-dependencies:
          applies-to: version-updates
          patterns:
              - '*'
          dependency-type: production
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 5
      include:
          - '*'
      exclude:
          - react
